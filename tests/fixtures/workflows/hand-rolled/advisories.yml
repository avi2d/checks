name: advisories

on:
  schedule:
    - cron: "21 5 * * 1"
  workflow_dispatch:

jobs:
  advisories:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bunx checks-advisories --all
