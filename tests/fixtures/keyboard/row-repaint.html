<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard focus fixture</title>
<style>
a { font-weight: 400; }
a:focus { font-weight: 700; outline: none; }
.row { padding: 40px; background: white; }
.row.touched { background: #eef; }
.row.touched:focus-within { outline: 3px solid black; }
input:focus { outline: none; }
</style>
</head>
<body>
<main>
<p><a id="link" href="/">Details</a></p>
<label class="row" style="display: block">Name <input id="field" type="text"></label>
</main>
<script>
document.querySelector("#field").addEventListener("blur", (event) => {
  event.target.closest(".row").classList.add("touched");
});
</script>
</body>
</html>
