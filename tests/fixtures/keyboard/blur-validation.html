<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard focus fixture</title>
<style>
label { display: block; margin: 24px; }
input { outline: none; }
#name:focus, input.invalid { outline: 3px solid black; }
</style>
</head>
<body>
<main>
<label>Name <input id="name" type="text"></label>
<label>Email <input id="email" type="email"></label>
</main>
<script>
for (const input of document.querySelectorAll("input")) {
  input.addEventListener("blur", () => input.classList.add("invalid"));
  input.addEventListener("focus", () => input.classList.remove("invalid"));
}
</script>
</body>
</html>
