<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard focus fixture</title>
<style>
#first:focus, #second:focus { outline: none; }
#first:focus, #second.ready:focus { outline: 3px solid black; }
</style>
</head>
<body>
<main>
<a id="first" href="/">First</a>
<a id="second" href="/">Second</a>
</main>
<script>
const first = document.querySelector("#first");
const second = document.querySelector("#second");
let blurs = 0;
let focusouts = 0;
first.addEventListener("blur", () => { blurs += 1; });
document.addEventListener("focusout", (event) => {
  if (event.target === first) focusouts += 1;
});
second.addEventListener("focus", () => {
  second.classList.toggle("ready", blurs === 1 && focusouts === 1);
});
</script>
</body>
</html>
