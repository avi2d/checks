title = "checks-secrets"

[extend]
useDefault = true

[[rules]]
id = "wireguard-key"
description = "A WireGuard or AmneziaWG private or pre-shared key"
regex = '''(?i)(?:private[_-]?key|pre[_-]?shared[_-]?key|psk)["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=)'''
secretGroup = 1
entropy = 3.0
keywords = ["private", "preshared", "pre_shared", "pre-shared", "psk"]

[[rules]]
id = "wireguard-key-file"
description = "A WireGuard or AmneziaWG key alone on a line of a file whose name says private, priv, pre-shared or psk"
path = '''(?i)(?:^|/)[^/]*(?:priv|pre[_-]?shared|psk)[^/]*$'''
regex = '''(?m)^[ \t]*([A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=)[ \t]*\r?$'''
secretGroup = 1
entropy = 3.0

[[rules]]
id = "wireguard-dot-key-file"
description = "A WireGuard or AmneziaWG key alone on a line of a .key file not named for a public key"
path = '''(?i)\.key$'''
regex = '''(?m)^[ \t]*([A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=)[ \t]*\r?$'''
secretGroup = 1
entropy = 3.0

[[rules.allowlists]]
description = "A .key file named for a public key"
paths = ['''(?i)pub(?:lic)?\.key$''']

[[rules]]
id = "proxy-userinfo-link"
description = "A proxy share link that carries its credential before the @, such as vless://, trojan://, socks5:// or wireguard://"
regex = '''(?i)\b(?:vless|vmess|ss|trojan|hysteria2?|hy2|tuic|socks5?h?|wireguard|wg)://([^\s"'`<>@?#]+)@[^\s"'`<>]+'''
secretGroup = 1
entropy = 2.5
keywords = ["vless://", "vmess://", "ss://", "trojan://", "hysteria://", "hysteria2://", "hy2://", "tuic://", "socks://", "socksh://", "socks5://", "socks5h://", "wireguard://", "wg://"]

[[rules.allowlists]]
description = "A link to a reserved example or test host"
regexTarget = "match"
regexes = ['''^(?i)[a-z0-9]+://(?:[^\s"'`@?#]*@)?(?:[\w-]+\.)*(?:example\.(?:com|net|org)|[\w-]+\.(?:example|invalid|test)|localhost)(?::\d+)?(?:[/?#]|$)''']

[[rules]]
id = "proxy-base64-link"
description = "A proxy share link whose whole payload is base64, such as vmess://, ss:// or ssr://"
regex = '''(?i)\b(?:vmess|ssr?)://([A-Za-z0-9+/_-]{16,}={0,2})@?'''
secretGroup = 1
entropy = 4.2
keywords = ["vmess://", "ss://", "ssr://"]

[[rules.allowlists]]
description = "A payload an @ follows, which proxy-userinfo-link judges"
regexTarget = "match"
regexes = ['''@$''']

[[rules]]
id = "proxy-query-credential"
description = "A credential in the auth, auth_str, obfsParam, obfs-password, password or pk query parameter of a link, such as hysteria://host?auth="
regex = '''(?i)[?&](?:auth|auth_str|obfsParam|obfs-password|password|pk)=([^\s"'`<>&#]+)'''
secretGroup = 1
entropy = 2.5
keywords = ["auth=", "auth_str=", "obfsparam=", "obfs-password=", "password=", "pk="]

[[rules.allowlists]]
description = "A line whose link to a reserved example or test host carries one of these parameters"
regexTarget = "line"
regexes = ['''(?i)[a-z0-9]+://(?:[^\s"'`@?#/]*@)?(?:[\w-]+\.)*(?:example\.(?:com|net|org)|[\w-]+\.(?:example|invalid|test)|localhost)(?::\d+)?(?:/[^\s"'`<>?#]*)?\?[^\s"'`<>#]*?\b(?:auth|auth_str|obfsParam|obfs-password|password|pk)=''']

[[rules]]
id = "proxy-subscription-url"
description = "A proxy subscription URL whose path or query carries its token"
regex = '''(?i)(?:\bhttps?://[^\s"'`<>/]+/(?:[^\s"'`<>?]*/)?(?:sub|subs|subscribe|subscription|link)/|[?&](?:token|key|uuid|id)=)([A-Za-z0-9_-]{16,})'''
secretGroup = 1
entropy = 3.0
keywords = ["sub", "link"]

[[rules.required]]
id = "proxy-subscription-path"
withinLines = 0

[[rules]]
id = "proxy-subscription-path"
description = "An http or https URL whose last path segment before its token or query is sub, subs, subscribe, subscription or link"
regex = '''(?i)\bhttps?://[^\s"'`<>/]+/(?:[^\s"'`<>?]*/)?(?:sub|subs|subscribe|subscription|link)[/?]'''
keywords = ["sub", "link"]
skipReport = true

[[rules.allowlists]]
description = "A link to a reserved example or test host"
regexTarget = "match"
regexes = ['''^(?i)https?://(?:[\w-]+\.)*(?:example\.(?:com|net|org)|[\w-]+\.(?:example|invalid|test)|localhost)(?:[:/?#]|$)''']

[[allowlists]]
description = "A link credential that is only template references, such as {password}, ${pass}, ${pass:-}, ${pass:?message}, $PASS, {{ password }} or %(password)s, with a user part that is one too"
targetRules = ["proxy-userinfo-link", "proxy-query-credential"]
regexes = ['''^(?:(?:\$\{[A-Za-z_][\w.]*(?:\}|:?-\}|:?\?[^}\s]*\}?)|\$[A-Za-z_]\w*|\{\{\s*[A-Za-z_][\w.]*\s*\}\}|\{[A-Za-z_][\w.]*\}|%\([A-Za-z_][\w.]*\)s):)?(?:\$\{[A-Za-z_][\w.]*(?:\}|:?-\}|:?\?[^}\s]*\}?)|\$[A-Za-z_]\w*|\{\{\s*[A-Za-z_][\w.]*\s*\}\}|\{[A-Za-z_][\w.]*\}|%\([A-Za-z_][\w.]*\)s)$''']
