name: daily-release
on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, fm/checks-daily-release-proof]

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name != 'push' || github.ref_name == 'fm/checks-daily-release-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-pull-request
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: report unreleased changes
        id: report
        run: |
          if bun src/delivery/release-report.ts; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          elif [ $? -eq 1 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            exit 2
          fi
      - name: open or refresh the release pull request
        if: steps.report.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/release-pr.ts ci.yml commitlint.yml

  tag:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/release-tag.ts release.yml
