name: pr-title

# ci lints the title on each push, so an edit to the title alone reruns only this rather than the whole suite.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    if: github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/commit-title.ts
      # Branch protection requires a commitlint check, which no job of that name reports.
      - name: report the title as commitlint
        if: always()
        uses: avi2d/workflows/commitlint-status@v1
        with:
          outcome: ${{ steps.title.outcome }}
