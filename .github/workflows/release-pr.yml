name: release-pr
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pull-request:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-pull-request
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: fail fast when the release cannot plan
        run: bun src/delivery/release-preflight.ts release.yml
      - name: open or refresh the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/release-pr.ts ci.yml
      - name: delete the held runs on the release head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/${{ github.ref_name }}
        run: bunx checks-ci held-runs
  tag:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: landed tree matches the tested pull request tree
        run: bun src/delivery/tested-tree.ts
      - name: tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/release-tag.ts release.yml
