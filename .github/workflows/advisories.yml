name: advisories
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun src/dependencies/advisories.ts --all
