name: release
on:
  push:
    tags: ["v*"]
  # A tag pushed with the workflow token starts no push run, so checks-release-tag dispatches this.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: fail fast when the release cannot run
        run: bun src/delivery/release-preflight.ts release.yml
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ref is a tag
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: landed tree matches the tested pull request tree
        run: bun src/delivery/tested-tree.ts
      - run: bun run build
      - run: git diff --exit-code
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test --full
      - name: tag matches package version
        env:
          PACKAGE_PATH: package.json
          TAG: ${{ github.ref_name }}
        run: bunx checks-ci release-version

  build-binaries:
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: build and run the compiled binary
        run: bun run release:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-${{ matrix.runner }}
          path: release-assets/checks-*
          if-no-files-found: error

  publish:
    needs: [verify, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: release-assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: stage the platform packages
        run: bun scripts/package-release.ts stage release-assets
      - name: publish the platform packages
        run: bun scripts/package-release.ts publish release-assets
      - name: add the matching optional dependencies
        run: bun scripts/package-release.ts manifest package.json
      - name: publish the main package
        run: bun src/delivery/release-publish.ts

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: version
        name: read the released version
        env:
          PACKAGE_PATH: package.json
          TAG: ${{ github.ref_name }}
        run: bunx checks-ci release-version
      - name: extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun src/delivery/release-notes.ts "$VERSION" "$RUNNER_TEMP/release-notes.md"
      - name: create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: bunx checks-ci github-release

  assets:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: release-assets
      - name: attach the binaries and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber
