name: release
on:
  push:
    tags: ["v*"]
  # A tag pushed with the workflow token starts no push run, so checks-release-tag dispatches this.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          fetch-depth: 0
      - name: fail fast when the release cannot run
        run: bun src/delivery/release-preflight.ts release.yml
  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ref is a tag
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: avi2d/workflows/actions/setup@v2
        with:
          fetch-depth: 0
      - name: tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: landed tree matches the tested pull request tree
        run: bun scripts/tested-tree.ts
      - run: bun run build
      - run: git diff --exit-code
      - run: bun run lint
      - run: bun run typecheck
      - name: tag matches package version
        uses: avi2d/workflows/actions/release-version@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun src/delivery/release-publish.ts

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - id: version
        name: read the released version
        uses: avi2d/workflows/actions/release-version@v2
      - name: extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun src/delivery/release-notes.ts "$VERSION" "$RUNNER_TEMP/release-notes.md"
      - name: create or update GitHub release
        uses: avi2d/workflows/actions/github-release@v2
        with:
          notes-file: ${{ runner.temp }}/release-notes.md
