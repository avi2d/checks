name: mutation

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
    paths: ["src/**", "tests/unit/**", "stryker.conf.mjs", "package.json", "bun.lock", ".bun-version", "bunfig.toml"]
  workflow_dispatch:
    inputs:
      mode: { type: choice, options: [baseline, refresh], default: baseline }

jobs:
  mutation:
    uses: avi2d/workflows/.github/workflows/mutation.yml@e35db24ce1a15e02f65826fca719b8ed632553bc
    permissions: { contents: read, actions: write, pull-requests: write }
    with:
      mode: ${{ github.event_name == 'pull_request' && 'compare' || inputs.mode || 'baseline' }}
