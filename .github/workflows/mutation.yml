name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    # A baseline must finish to upload, so queue rather than cancel.
    concurrency:
      group: mutation-baseline
      cancel-in-progress: false
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Restoring state keeps a full baseline within the timeout.
      - name: Restore previous full baseline state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/testing/mutation-baseline.ts --full reports/mutation/mutation.json reports/stryker-incremental.json
      - run: time bun run mutate:incremental
      # Readers take only main's baseline, so uploads from other runs cannot replace it.
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline
          path: |
            reports/mutation/mutation.json
            reports/stryker-incremental.json
          retention-days: 7
      # This repository is public, so its artifacts miss the storage quota.
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline-full
          path: |
            reports/mutation/mutation.json
            reports/stryker-incremental.json
          retention-days: 90
      - name: Prune superseded baselines
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/testing/mutation-baseline.ts --prune
