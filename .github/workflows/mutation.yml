name: mutation

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - stryker.conf.mjs
      - stryker.preset.js
      - package.json
      - bun.lock
      - .github/workflows/mutation.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - stryker.conf.mjs
      - stryker.preset.js
      - package.json
      - bun.lock
      - .github/workflows/mutation.yml
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

# Advisory on purpose: the comparator's --advisory flag keeps a regression from
# failing the job, so a failure here still means the run itself broke.

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name != 'pull_request'
    # Queue rather than cancel: a baseline must finish to upload, and the queued run resumes from it.
    concurrency:
      group: mutation-baseline
      cancel-in-progress: false
    # About 45 minutes for the first full run on these runners; later
    # pushes are incremental from the uploaded state and take minutes.
    timeout-minutes: ${{ github.event_name == 'push' && 60 || 90 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Only pushes reuse state, so a scheduled or hand-started run tests every mutant afresh.
      # The previous baseline's incremental state turns every push after the first into the mutants main changed.
      - name: Restore previous baseline state
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow mutation.yml --branch main --status success --limit 20 --json databaseId,event --jq 'map(select(.event != "pull_request"))[0].databaseId // empty')"
          download="$(mktemp -d)"
          if [ -n "$run_id" ] && gh run download "$run_id" --name mutation-baseline --dir "$download" && [ -f "$download/stryker-incremental.json" ]; then
            mkdir -p reports
            cp "$download/stryker-incremental.json" reports/stryker-incremental.json
          fi
      # Incremental with no prior state runs everything, and writes the state the next main run reuses.
      - if: github.event_name == 'push'
        run: time bun run mutate:incremental
      # Bail records only a mutant's first killer, and a static mutant has no coverage, so a full run keeps every killing test.
      - if: github.event_name != 'push'
        run: time bun run mutate:incremental --disableBail
      # Every run uploads; readers take only main's, so a manual run elsewhere leaves main's baseline in place.
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline
          path: |
            reports/mutation/mutation.json
            reports/stryker-incremental.json
          retention-days: 90
      # Only a run that restored nothing lists every covering test, so only it uploads the report the scope step reads.
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline-full
          path: reports/mutation/mutation.json
          retention-days: 90

  compare:
    if: github.event_name == 'pull_request'
    # Cancel here and never on main: a newer push obsoletes this comparison, while a baseline must run to upload.
    concurrency:
      group: mutation-${{ github.ref }}
      cancel-in-progress: true
    # Scoped to the files the pull request changes, so minutes track the diff, not the suite.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Changed src files mutate directly; changed tests add the src files they
      # cover in main's baseline, so a test-only pull request is measured too.
      # A unit test that imports a changed helper or names a changed fixture
      # counts as changed, so a weakened helper is measured too.
      - name: Select mutation scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          baseline="$(mktemp -d)/mutation.json"
          # One query per event, so main's pushes cannot crowd a full baseline out of the list.
          scheduled="$(gh run list --workflow mutation.yml --branch main --event schedule --status success --limit 1 --json databaseId,createdAt --jq '.[]')"
          dispatched="$(gh run list --workflow mutation.yml --branch main --event workflow_dispatch --status success --limit 1 --json databaseId,createdAt --jq '.[]')"
          download="$(mktemp -d)"
          # A run that predates the full artifact has none, so the older candidate gets its turn.
          for run_id in $(printf '%s\n%s\n' "$scheduled" "$dispatched" | jq -rs 'sort_by(.createdAt) | reverse | .[].databaseId'); do
            if gh run download "$run_id" --name mutation-baseline-full --dir "$download/$run_id" && [ -f "$download/$run_id/mutation.json" ]; then
              cp "$download/$run_id/mutation.json" "$baseline"
              break
            fi
          done
          scripts/mutation-scope.sh "$base" "$baseline" >> "$GITHUB_ENV"
      - name: Report empty scope
        if: env.SCOPE == ''
        run: "echo 'mutation: no source files changed, nothing to mutate'"
      - uses: oven-sh/setup-bun@v2
        if: env.SCOPE != ''
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        if: env.SCOPE != ''
        with:
          node-version: 24
      - if: env.SCOPE != ''
        run: bun install --frozen-lockfile
      - name: Build scope report at merge base
        if: env.SCOPE != ''
        run: |
          git worktree add "$RUNNER_TEMP/mutation-base" "$BASE_SHA"
          report="$RUNNER_TEMP/mutation-base/reports/mutation/mutation.json"
          if [ ! -f "$RUNNER_TEMP/mutation-base/stryker.conf.mjs" ]; then
            echo 'mutation: merge base predates mutation testing, skipping comparison'
            echo 'SKIP_COMPARE=true' >> "$GITHUB_ENV"
          elif [ -z "$BASE_SCOPE" ]; then
            echo 'mutation: every scope file is new, comparing against an empty base report'
            mkdir -p "$(dirname "$report")"
            echo '{"files":{}}' > "$report"
          else
            (cd "$RUNNER_TEMP/mutation-base" && bun install --frozen-lockfile && time bunx stryker run --mutate "$BASE_SCOPE")
          fi
      - name: Build scope report at head
        if: env.SCOPE != '' && env.SKIP_COMPARE != 'true'
        run: time bunx stryker run --mutate "$SCOPE"
      - name: Compare scope reports
        if: env.SCOPE != '' && env.SKIP_COMPARE != 'true'
        run: bun src/testing/mutation-compare.ts --advisory "$RUNNER_TEMP/mutation-base/reports/mutation/mutation.json" reports/mutation/mutation.json
