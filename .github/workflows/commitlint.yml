permissions:
  contents: read
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Only the title is linted: it is what a squash merge lands, with GitHub appending " (#N)" to it.
      - run: printf '%s' "$PR_TITLE (#0000)" > "$RUNNER_TEMP/pr-title"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      # A title starting with git's comment character lints as empty without this: commentChar moves off '#'.
      - run: bun run ./node_modules/.bin/commitlint --config ./commitlint.config.js --edit "$RUNNER_TEMP/pr-title"
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.commentChar
          GIT_CONFIG_VALUE_0: "\x01"
