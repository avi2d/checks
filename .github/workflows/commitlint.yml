name: commitlint
on:
  workflow_call:
    inputs:
      ref:
        description: Ref of avi2d/checks to lint with
        type: string
        default: main

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: avi2d/checks
          ref: ${{ inputs.ref }}
          path: checks
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: checks
      # Only the title is linted: per-commit messages are never conventional,
      # and the title is what a squash merge lands, with GitHub appending
      # " (#N)" to it. Lint the landed string, not the bare title.
      - run: printf '%s' "$PR_TITLE (#0000)" | ./checks/node_modules/.bin/commitlint --config ./checks/commitlint.config.js
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
