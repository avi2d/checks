name: release-push
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: release-push
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: fail fast when the release cannot plan
        run: |
          if git log -1 --format=%s HEAD | grep -qE '^chore: release [0-9]+\.[0-9]+\.[0-9]+( \(#[0-9]+\))?$'; then
            echo "HEAD already holds the release commit, so release-push recovers its tag instead of planning"
          else
            bun src/delivery/release-preflight.ts release.yml
          fi
      - name: release what main holds once its checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/release-push.ts release.yml ci.yml
