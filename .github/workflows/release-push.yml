name: release-push
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-push
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: release what main holds once its checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/release-push.ts release.yml ci.yml
