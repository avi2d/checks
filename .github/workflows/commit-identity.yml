name: commit-identity
on:
  workflow_call:
    inputs:
      ref:
        description: Ref of avi2d/checks to check with
        type: string
        default: main

jobs:
  commit-identity:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the check walks every commit between the two shas,
      # and the base sha is unreachable from a shallow fetch of the head.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: avi2d/checks
          ref: ${{ inputs.ref }}
          path: .checks
      - uses: oven-sh/setup-bun@v2
      - run: bun .checks/scripts/commit-identity.ts "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
