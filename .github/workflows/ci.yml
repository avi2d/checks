name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  # A dispatched run carries no pull request, so the title lookup needs read access.
  pull-requests: read

# release-push waits on a dispatched run, so it gets its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e-skip: ${{ steps.skip.outputs.e2e-skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: skip
        run: bun scripts/e2e-skip.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # A path filter would leave this required check unreported.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run test:unit
  e2e:
    needs: changes
    # A step gate would still pay for checkout and install.
    if: needs.changes.outputs.e2e-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/commit-title.ts
      # Branch protection requires a commitlint check that no job reports.
      - name: report the title as commitlint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.title.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/${HEAD_SHA:-$GITHUB_SHA}" -f state="$state" -f context=commitlint -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      # A path filter would leave this required check unreported.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - run: bun run build
      - run: git diff --exit-code
      # checks-docs checks only the range it is given, so lint runs on docs-only changes.
      - run: bun run lint
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run typecheck
  checks:
    # Branch protection passes a skipped job, so this runs and fails when a part fails.
    needs: [changes, unit, e2e, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every part
        env:
          CHANGES: ${{ needs.changes.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_SKIP: ${{ needs.changes.outputs.e2e-skip }}
          STATIC: ${{ needs.static.result }}
        run: |
          test "$CHANGES" = success
          test "$UNIT" = success
          test "$STATIC" = success
          test "$E2E" = success || { test "$E2E" = skipped && test "$E2E_SKIP" = true; }
      # GitHub keeps a dispatched run's check off the pull request, so this posts a commit status.
      - name: report the result on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="$GITHUB_JOB" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
