name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  # A dispatched run carries no pull request, so the title lookup needs read access.
  pull-requests: read

# A dispatched run gets its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.skip.outputs.docs-only }}
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: skip
        uses: avi2d/workflows/actions/docs-only@v2
        with:
          head: ${{ github.event.pull_request.head.sha }}
          paths: "*.[mM][dD] copy.json"
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # A path filter would leave this required check unreported.
      - id: filter
        uses: avi2d/workflows/actions/docs-only@v2
        with:
          head: ${{ github.event.pull_request.head.sha }}
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run test:unit
  e2e:
    needs: changes
    # A step gate would still pay for checkout and install.
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: bun run test:e2e
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: avi2d/workflows/actions/setup@v2
        with:
          # The merge commit would hide the pull request head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/commit-title.ts
      # Branch protection requires a commitlint check that no job of that name reports.
      - name: report the title as commitlint
        if: always()
        uses: avi2d/workflows/actions/commitlint-status@v2
        with:
          outcome: ${{ steps.title.outcome }}
      # A path filter would leave this required check unreported.
      - id: filter
        uses: avi2d/workflows/actions/docs-only@v2
        with:
          head: ${{ github.event.pull_request.head.sha }}
      - run: bun run build
      - run: git diff --exit-code
      # checks-docs checks only the range it is given, so lint runs on docs-only changes.
      - run: bun run lint
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run typecheck
  checks:
    # Branch protection passes a skipped job, so this runs and fails when a part fails.
    needs: [changes, unit, e2e, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every part
        uses: avi2d/workflows/actions/require-success@v2
        with:
          results: changes=${{ needs.changes.result }} unit=${{ needs.unit.result }} e2e=${{ needs.e2e.result }} static=${{ needs.static.result }}
          skips: e2e=${{ needs.changes.outputs.docs-only }}
      # GitHub keeps a dispatched run's check off the pull request, so this posts a commit status.
      - name: report the result on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        uses: avi2d/workflows/actions/head-status@v2
        with:
          job-status: ${{ job.status }}
