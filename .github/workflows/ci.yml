name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  # A dispatched run carries no pull request, so the title lookup needs read access.
  pull-requests: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Path filters would leave this required check unreported, so steps gate on the filter instead.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run test:unit
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Path filters would leave this required check unreported, so steps gate on the filter instead.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run test:e2e
  checks:
    # Branch protection requires the checks context alone and passes a skipped one, so the job runs after a failed tier and fails on it.
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/commit-title.ts
      # Branch protection requires a commitlint check, which no job of that name reports.
      - name: report the title as commitlint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.title.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/${HEAD_SHA:-$GITHUB_SHA}" -f state="$state" -f context=commitlint -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      # Path filters would leave this required check unreported, so steps gate on the filter instead.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - run: bun run build
      - run: git diff --exit-code
      # A docs-only change still runs lint, since checks-docs checks only the range it is given.
      - run: bun run lint
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run typecheck
      - name: require both test tiers
        env:
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: test "$UNIT" = success && test "$E2E" = success
      # GitHub keeps a dispatched run's check off the pull request, so the job reports its result there as a commit status.
      - name: report the result on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="$GITHUB_JOB" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
