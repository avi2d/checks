name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  # A dispatched run carries no pull request, so the title lookup needs read access.
  pull-requests: read

# A dispatched run is one release-push waits on, so only a pull request's newer push cancels a run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e-skip: ${{ steps.skip.outputs.e2e-skip }}
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: skip
        run: bun scripts/e2e-skip.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Path filters would leave this required check unreported, so steps gate on the filter instead.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run test:unit
  e2e:
    needs: changes
    # A step gate would still pay for checkout and install, so the whole job skips on a change the changes job marks.
    if: needs.changes.outputs.e2e-skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: bun run test:e2e
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          # The merge commit would hide the pull request head, so check out the head itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: title
        name: lint the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bun src/delivery/commit-title.ts
      # Branch protection requires a commitlint check, which no job of that name reports.
      - name: report the title as commitlint
        if: always()
        uses: avi2d/workflows/commitlint-status@v1
        with:
          outcome: ${{ steps.title.outcome }}
      # Path filters would leave this required check unreported, so steps gate on the filter instead.
      - id: filter
        run: bun src/delivery/docs-only.ts ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
      - run: bun run build
      - run: git diff --exit-code
      # A docs-only change still runs lint, since checks-docs checks only the range it is given.
      - run: bun run lint
      - if: steps.filter.outputs.docs-only != 'true'
        run: bun run typecheck
  checks:
    # Branch protection requires the checks context alone and passes a skipped one, so the job runs after a failed part and fails on it.
    needs: [changes, unit, e2e, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every part
        env:
          CHANGES: ${{ needs.changes.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_SKIP: ${{ needs.changes.outputs.e2e-skip }}
          STATIC: ${{ needs.static.result }}
        run: |
          test "$CHANGES" = success
          test "$UNIT" = success
          test "$STATIC" = success
          # A skipped e2e job passes only for a change the changes job marked skippable.
          test "$E2E" = success || { test "$E2E" = skipped && test "$E2E_SKIP" = true; }
      # GitHub keeps a dispatched run's check off the pull request, so the job reports its result there as a commit status.
      - name: report the result on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        uses: avi2d/workflows/head-status@v1
        with:
          job-status: ${{ job.status }}
