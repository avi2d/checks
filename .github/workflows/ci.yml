name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/commitlint.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  commit-identity:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/commit-identity.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  comment-gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/comment-gate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  checks:
    runs-on: ubuntu-latest
    steps:
      # The pull request merge commit is authored by GitHub, which lint's
      # commit-identity check refuses, so lint the head commit itself.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code dist/
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
