name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The head, not GitHub's merge ref, so the tree the gates read is the commit the range ends at.
      # The whole history, since the range starts where the head branched from the base branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # GitHub keeps a dispatched run's check off the pull request, so the job reports its result there as a commit status.
      - name: report the result on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="$GITHUB_JOB" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
