name: pr-text

on:
  # pull_request withholds secrets from forks, so this job must never check out pull request code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  pr-text:
    # GitHub withholds secrets from a fork's review, so the scan would skip it; another trigger scans it.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (!startsWith(github.event_name, 'pull_request_review') || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: pr-text-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Only the repository secret decides the skip; no pull request value reaches this step.
      - id: pack
        name: decide whether a private pack is configured
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: bash scripts/workflow-pr-text-configured.sh
      - name: write the private pack
        if: steps.pack.outputs.configured == 'true'
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: bash scripts/workflow-pr-text-pack.sh
      - id: scan
        if: steps.pack.outputs.configured == 'true'
        run: bun src/delivery/pr-text.ts "$NUMBER"
      # A comment's run reports on no pull request, so this posts a commit status.
      - name: report the result on the head commit
        if: ${{ !cancelled() }}
        env:
          CONFIGURED: ${{ steps.pack.outputs.configured }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: bash scripts/workflow-pr-text-status.sh
