name: pr-text

on:
  # The base branch's workflow runs with the secret even for a fork, and the job reads the pull request's text without checking out its code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  pr-text:
    # GitHub withholds secrets from a review on a fork's pull request, so the pack would fail closed there; the next run of another trigger scans that review.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (!startsWith(github.event_name, 'pull_request_review') || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: pr-text-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: write the private pack
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: |
          printf '%s' "$PACK" > "$RUNNER_TEMP/secrets-pack.json"
          echo "CHECKS_SECRETS_PACK=$RUNNER_TEMP/secrets-pack.json" >> "$GITHUB_ENV"
      - id: scan
        run: bun src/delivery/pr-text.ts "$NUMBER"
      # A comment's run reports on no pull request, so the job reports its result on the head commit.
      - name: report the result on the head commit
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" -f context=pr-text -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
