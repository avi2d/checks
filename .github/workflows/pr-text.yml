name: pr-text

on:
  # pull_request withholds secrets from forks, so this job must never check out pull request code.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  pr-text:
    # GitHub withholds secrets from a fork's review, so the scan would skip it; another trigger scans it.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (!startsWith(github.event_name, 'pull_request_review') || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: pr-text-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Only the repository secret decides the skip; no pull request value reaches this step.
      - id: pack
        name: decide whether a private pack is configured
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: |
          if [ -n "$PACK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            message="pr-text scan skipped: no private pack is configured (CHECKS_SECRETS_PACK is unset), so this pull request's text was not scanned for private terms"
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: write the private pack
        if: steps.pack.outputs.configured == 'true'
        env:
          PACK: ${{ secrets.CHECKS_SECRETS_PACK }}
        run: |
          printf '%s' "$PACK" > "$RUNNER_TEMP/secrets-pack.json"
          echo "CHECKS_SECRETS_PACK=$RUNNER_TEMP/secrets-pack.json" >> "$GITHUB_ENV"
      - id: scan
        if: steps.pack.outputs.configured == 'true'
        run: bun src/delivery/pr-text.ts "$NUMBER"
      # A comment's run reports on no pull request, so this posts a commit status.
      - name: report the result on the head commit
        if: ${{ !cancelled() }}
        env:
          CONFIGURED: ${{ steps.pack.outputs.configured }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          state=failure
          description="the scan failed or did not run"
          if [ "$CONFIGURED" = false ]; then
            state=success
            description="scan skipped: no private pack is configured (CHECKS_SECRETS_PACK is unset)"
          elif [ "$CONFIGURED" = true ] && [ "$OUTCOME" = success ]; then
            state=success
            description="the scan passed"
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" -f description="$description" -f context=pr-text -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
