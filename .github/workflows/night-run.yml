name: night-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-run
  cancel-in-progress: false

jobs:
  mutation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: delivery
            mutate: src/delivery/**/*.ts,src/complexity/**/*.ts
          - shard: quality
            mutate: src/quality/**/*.ts,src/core/**/*.ts,src/dependencies/**/*.ts
          # Every directory the other shards leave out lands here, so a new one is still mutated.
          - shard: rest
            mutate: src/**/*.ts,!src/delivery/**,!src/complexity/**,!src/quality/**,!src/core/**,!src/dependencies/**
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: time bun run mutate -- --mutate '${{ matrix.mutate }}'
      - uses: actions/upload-artifact@v4
        with:
          name: night-run-mutation-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          retention-days: 1

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: mkdir -p reports/night-run-gates && bun src/core/lint.ts --night > reports/night-run-gates/gates.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: night-run-gates
          path: reports/night-run-gates/
          retention-days: 1

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium-headless-shell webkit
      # A failing test becomes an issue, so its exit leaves the job going on to the upload.
      - run: |
          bun src/testing/test.ts --tier=unit --junit=reports/night-run-tests/unit.xml || true
          bun src/testing/test.ts --tier=e2e --parallel=4 --junit=reports/night-run-tests/e2e.xml || true
          bun src/testing/test.ts --tier=live --junit=reports/night-run-tests/live.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: night-run-tests
          path: reports/night-run-tests/
          retention-days: 1

  report:
    needs: [mutation, gates, tests]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # A pattern downloads the shards that uploaded and skips the rest, which checks-night-run files as missing.
      - uses: actions/download-artifact@v4
        with:
          pattern: night-run-mutation-*
          path: reports/mutation
      - if: needs.gates.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: night-run-gates
          path: reports/night-run-gates
      - uses: actions/download-artifact@v4
        with:
          name: night-run-tests
          path: reports/night-run-tests
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/testing/night-run.ts --mutation reports/mutation/night-run-mutation-delivery/mutation.json --mutation reports/mutation/night-run-mutation-quality/mutation.json --mutation reports/mutation/night-run-mutation-rest/mutation.json --tests reports/night-run-tests/unit.xml --tests reports/night-run-tests/e2e.xml --tests reports/night-run-tests/live.xml ${{ needs.gates.result == 'success' && '--gates reports/night-run-gates/gates.log' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: night-run
          path: reports/night-run.json
          if-no-files-found: ignore
          retention-days: 90
